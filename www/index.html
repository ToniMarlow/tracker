<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#eef5ff;--bg2:#ffe0f0;--bg3:#d4fbee;--bg4:#e6dcff;--text:#16223f;--muted:rgba(22,34,63,.62);
--glass:rgba(255,255,255,.38);--gb:rgba(255,255,255,.8);--blk:rgba(255,255,255,.66);--field:rgba(255,255,255,.55);--shadow:0 10px 34px rgba(60,80,150,.15);

--ease:cubic-bezier(.2,.9,.2,1);--spring:cubic-bezier(.34,1.5,.64,1)}
:root[data-theme="dark"]{--bg1:#0b0e26;--bg2:#3a1262;--bg3:#0a4a58;--bg4:#1c2a7a;--text:#f2f5ff;--muted:rgba(242,245,255,.66);
--glass:rgba(255,255,255,.1);--gb:rgba(255,255,255,.22);--blk:rgba(255,255,255,.15);--field:rgba(255,255,255,.12);--shadow:0 10px 34px rgba(0,0,0,.4);
--hi:#ff6b7d;--mid:#ffb23d;--lo:#3fd9a8;--accent:#7a9bff;--warn:rgba(255,178,61,.26);--sheet:rgba(28,32,68,.78)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg1);color:var(--text);font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;transition:color .4s,background-color .4s}

.blk{position:absolute;display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:14px;overflow:hidden;background:var(--blk);border:1px solid var(--gb);border-left:4px solid var(--c);touch-action:pan-y;user-select:none;box-shadow:0 2px 10px rgba(40,60,120,.1);transition:background .3s,box-shadow .2s,opacity .3s}

.blk.nar{padding:4px 6px;gap:5px}.blk.nar .chk{display:none}.blk.nar .bt b{font-size:12.5px}.blk.nar .bs{font-size:11px}

.x{flex:none;width:30px;height:30px;border:0;background:none;color:var(--muted);border-radius:50%;display:grid;place-items:center;padding:0}.x svg{width:15px;height:15px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(59,108,255,.45);transition:transform .3s var(--spring)}
.fab:active{transform:scale(.88) rotate(90deg)}.fab svg{width:24px;height:24px;stroke-width:2.4}
.bd{position:fixed;inset:0;background:rgba(10,16,40,.32);opacity:0;pointer-events:none;transition:opacity .4s;z-index:8}.bd.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:9;left:50%;bottom:0;width:100%;max-width:600px;max-height:90vh;overflow:auto;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;transform:translate(-50%,110%);transition:transform .55s var(--ease);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);background:var(--sheet);border:1px solid var(--gb);overscroll-behavior:contain}
.sheet.on{transform:translate(-50%,0)}
.grab{height:26px;display:grid;place-items:center;touch-action:none;cursor:grab;margin-bottom:4px}.grab i{width:42px;height:5px;border-radius:9px;background:rgba(128,128,150,.5)}
.sheet h2{margin:0 0 14px;font-size:22px}
.lab{margin:14px 0 8px;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--gb);background:var(--field);border-radius:99px;padding:8px 13px;font-size:14px;transition:background .25s,color .25s,transform .18s var(--ease)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.acts .btn{flex:1}
.toast{position:fixed;z-index:12;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);padding:12px 18px;border-radius:99px;max-width:92vw;font-size:14px;transition:transform .55s var(--spring)}.toast.on{transform:translate(-50%,0)}
.st{display:grid;grid-template-columns:128px 1fr 28px;gap:10px;align-items:center;margin:11px 0;font-size:14px}
.st .bar{margin:0;height:10px}.st .bar i{background:var(--mid)}
.why{padding:10px 0;border-top:1px solid var(--gb);font-size:14px;line-height:1.4}.why small{display:block;color:var(--muted)}
input[type=range]{accent-color:var(--accent)}
.lite *,.lite *::before{animation-duration:.01ms!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="wall"></div><div id="dim"></div>
<div class="wrap">
  <div class="head">
    <h1>Трекер задач</h1>
    <div class="nav">
      <button class="glass circle" id="prev" aria-label="Предыдущий день"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="glass circle" id="next" aria-label="Следующий день"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="glass circle" id="set" aria-label="Оформление"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></button>
    </div>
  </div>
  <p class="sub" id="sub"></p>
  <div class="glass tabs" id="tabs"><i class="pill" id="pill"></i>
    <button data-t="day" aria-pressed="true">День</button><button data-t="stats" aria-pressed="false">Причины</button></div>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Новая задача"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="bd" id="bd"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast glass" id="toast" role="status"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
function h(t,a,...k){const e=document.createElement(t);a=a||{};for(const x in a){const v=a[x];if(v==null)continue;if(x==='class')e.className=v;else if(x.slice(0,2)==='on')e[x]=v;else e.setAttribute(x,v)}
 k.flat().forEach(c=>{if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c))});return e}
function svgX(){const n='http://www.w3.org/2000/svg',s=document.createElementNS(n,'svg'),p=document.createElementNS(n,'path');s.setAttribute('viewBox','0 0 24 24');p.setAttribute('d','M6 6l12 12M18 6L6 18');s.append(p);return s}

const PN=['Высокий','Средний','Низкий'],PC=['var(--hi)','var(--mid)','var(--lo)'],HH=64;
const LS='trk-v1';let docs={},col=null,tab='day',anim='',drag=false;
try{docs=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){}

function put(k,v,quiet){docs[k]=v;persist();if(col)col.doc(k).set(v).catch(()=>{});if(!quiet)render()}

const pad=n=>String(n).padStart(2,'0');

 return t.r==='daily'||(t.r==='weekdays'&&w>0&&w<6)||(t.r==='weekly'&&w===D(t.d).getDay())}
function dayTasks(ds){return Object.keys(docs).filter(k=>k.slice(0,2)==='t_'&&occurs(docs[k],ds)).map(k=>Object.assign({id:k.slice(2)},docs[k])).sort((a,b)=>a.s<b.s?-1:a.s>b.s?1:0)}

 if(n>new Date(ds+'T'+t.e))return'over';if(n>=new Date(ds+'T'+t.s))return'now';return'soon'}
function pending(){const o=[],t0=iso(new Date());for(let i=0;i<8;i++){const ds=shift(t0,-i);dayTasks(ds).forEach(t=>{if(status(t,ds)==='over')o.push({ds,t})})}return o}

/* sheet + toast */
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),4200)}
const grab=h('div',{class:'grab'},h('i'));
function sheet(node){const s=$('#sheet');s.style.transform='';s.replaceChildren(grab,node);s.scrollTop=0;requestAnimationFrame(()=>s.classList.add('on'));$('#bd').classList.add('on')}

$('#bd').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
(function(){let st=null;const s=$('#sheet');
 grab.addEventListener('pointerdown',e=>{st={y:e.clientY,dy:0};try{grab.setPointerCapture(e.pointerId)}catch(_){}s.style.transition='none'});
 grab.addEventListener('pointermove',e=>{if(!st)return;st.dy=Math.max(0,e.clientY-st.y);s.style.transform='translate(-50%,'+st.dy+'px)'});
 const end=()=>{if(!st)return;const dy=st.dy;st=null;s.style.transition='';if(dy>90)close();else s.style.transform=''};
 grab.addEventListener('pointerup',end);grab.addEventListener('pointercancel',end)})();
function chips(items,cur,on){const box=h('div',{class:'chips'});
 const draw=()=>box.replaceChildren(...items.map(it=>h('button',{class:'chip','aria-pressed':String(cur===it[0]),onclick:()=>{cur=it[0];on(cur);draw()}},it[1])));
 draw();box.set=v=>{cur=v;draw()};return box}

/* themes */
const TH={mode:'light',dim:.25,blur:22,lite:false,lum:.6};
try{Object.assign(TH,JSON.parse(localStorage.getItem('trk-theme')||'{}'))}catch(e){}
let wall=null;try{wall=localStorage.getItem('trk-wall')}catch(e){}
const saveTheme=()=>{try{localStorage.setItem('trk-theme',JSON.stringify(TH))}catch(e){}};
function applyTheme(){const R=document.documentElement,sys=matchMedia('(prefers-color-scheme: dark)').matches;let dark;
 if(TH.mode==='custom'&&wall){const eff=TH.lum*(1-TH.dim),mid=Math.abs(eff-.5)<.18;dark=eff<.5;R.dataset.wall='1';
  $('#wall').style.backgroundImage='url('+wall+')';$('#dim').style.opacity=TH.dim;
  R.style.setProperty('--glass','rgba(255,255,255,'+(dark?(mid?.2:.1):(mid?.5:.36))+')');
  R.style.setProperty('--blk','rgba(255,255,255,'+(dark?(mid?.26:.16):(mid?.76:.66))+')')}
 else{R.dataset.wall='';$('#wall').style.backgroundImage='';$('#dim').style.opacity=0;R.style.removeProperty('--glass');R.style.removeProperty('--blk');
  dark=TH.mode==='dark'||(TH.mode==='system'&&sys)}
 R.dataset.theme=dark?'dark':'light';R.style.setProperty('--blur',(TH.lite?8:TH.blur)+'px');R.classList.toggle('lite',!!TH.lite)}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(TH.mode==='system')applyTheme()})}catch(e){}
function pickWall(file,cb){const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const sc=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const s=document.createElement('canvas');s.width=s.height=24;const sx=s.getContext('2d');sx.drawImage(img,0,0,24,24);
  const d=sx.getImageData(0,0,24,24).data;let l=0;for(let i=0;i<d.length;i+=4)l+=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;
  cb(c.toDataURL('image/jpeg',.82),l/(d.length/4));URL.revokeObjectURL(u)};
 img.onerror=()=>toast('Не удалось открыть картинку');img.src=u}
function slider(label,min,max,val,on){const o=h('span',{},String(val));
 const r=h('input',{type:'range',min:String(min),max:String(max),value:String(val),style:'width:100%',oninput:()=>{o.textContent=r.value;on(+r.value)},onchange:saveTheme});
 return h('div',{},h('div',{class:'lab',style:'display:flex;justify-content:space-between'},label,o),r)}
function settingsSheet(){const box=h('div',{},h('h2',{},'Оформление'));

function errRu(m){m=String(m||'');return /Invalid login/i.test(m)?'Неверная почта или пароль':/already registered/i.test(m)?'Такой аккаунт уже есть: нажмите «Войти»':/at least 6|Password should/i.test(m)?'Пароль не короче 6 символов':/valid email|invalid format/i.test(m)?'Проверьте адрес почты':/rate limit/i.test(m)?'Слишком много попыток, подождите':/not confirmed/i.test(m)?'Подтвердите почту по письму':'Не получилось: '+m}
function authView(){chrome(false);$('#sub').textContent='Войдите, чтобы задачи были на всех устройствах';
 var em=h('input',{class:'fld',type:'email',placeholder:'Почта',autocomplete:'email'}),pw=h('input',{class:'fld',type:'password',placeholder:'Пароль, не короче 6 символов',autocomplete:'current-password'});
 function go(up){var e=em.value.trim(),p=pw.value;if(!e||p.length<6)return toast('Введите почту и пароль от 6 символов');
  (up?sb.auth.signUp({email:e,password:p}):sb.auth.signInWithPassword({email:e,password:p})).then(function(r){
   if(r.error)return toast(errRu(r.error.message));
   if(up&&!(r.data&&r.data.session))toast('Аккаунт создан. Подтвердите почту по письму и войдите')}).catch(function(){toast('Нет соединения')})}
 pw.addEventListener('keydown',function(e){if(e.key==='Enter')go(false)});
 $('#view').replaceChildren(h('div',{class:'card glass'},em,h('div',{style:'height:10px'}),pw,
  h('div',{class:'acts'},h('button',{class:'btn soft',onclick:function(){go(true)}},'Создать аккаунт'),h('button',{class:'btn',onclick:function(){go(false)}},'Войти'))))}
async function startSync(s){if(syncing)return;syncing=true;user=s.user;uid=user.id;needAuth=false;
 var key='trk-u-'+uid,dirty=loadDirty(),local=docs;
 if(!localStorage.getItem(key))Object.keys(local).forEach(function(k){dirty[k]='p'});
 try{var rows=[],from=0;
  for(;;){var r=await sb.from('items').select('key,value').range(from,from+999);if(r.error)throw r.error;rows=rows.concat(r.data);if(r.data.length<1000)break;from+=1000}
  var remote={};rows.forEach(function(x){remote[x.key]=x.value});
  Object.keys(dirty).forEach(function(k){if(dirty[k]==='p'&&local[k]!==undefined)remote[k]=local[k];if(dirty[k]==='d')delete remote[k]});
  docs=remote;persist();saveDirty(dirty);try{localStorage.setItem(key,'1')}catch(e){}
  synced=true;subscribe();flush();render()}
 catch(e){toast('Нет связи с сервером, показаны данные телефона');render()}
 syncing=false}
function subscribe(){if(ch)sb.removeChannel(ch);
 ch=sb.channel('items-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'items'},function(p){
  if(p.eventType==='DELETE'){if(p.old&&p.old.user_id&&p.old.user_id!==uid)return;if(p.old&&p.old.key)delete docs[p.old.key]}
  else if(p.new&&p.new.user_id===uid)docs[p.new.key]=p.new.value;
  persist();if(!document.activeElement||document.activeElement.id!=='note')render()}).subscribe()}
function loggedOut(){user=null;uid=null;synced=false;docs={};persist();saveDirty({});if(ch){sb.removeChannel(ch);ch=null}needAuth=true;render();sched()}
function signOut(){sb.auth.signOut().catch(function(){})}

function nativeInit(){try{var C=window.Capacitor;
 if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.LocalNotifications){LN=C.Plugins.LocalNotifications;
  LN.requestPermissions().catch(function(){});
  LN.createChannel({id:'tasks',name:'Задачи',importance:4,visibility:1,vibration:true}).catch(function(){})}}catch(e){}}
function sched(){clearTimeout(stt);stt=setTimeout(scheduleNative,800)}
async function scheduleNative(){if(!LN)return;
 try{var p=await LN.getPending();
  if(p.notifications&&p.notifications.length)await LN.cancel({notifications:p.notifications.map(function(n){return{id:n.id}})});
  var out=[],id=1,now=new Date(),t0=iso(now);
  for(var i=0;i<7;i++){var ds=shift(t0,i),left=0;
   dayTasks(ds).forEach(function(t){if(logOf(ds,t.id))return;left++;var at=new Date(ds+'T'+t.e);
    if(at>now)out.push({id:id++,title:'Время вышло',body:'«'+t.n+'»: отметьте или укажите причину',schedule:{at:at,allowWhileIdle:true},channelId:'tasks'})});
   var ev=new Date(ds+'T21:00');
   if(left&&ev>now)out.push({id:id++,title:'Итоги дня',body:'Задач без отметки: '+left+'. Откройте трекер и укажите причины',schedule:{at:ev,allowWhileIdle:true},channelId:'tasks'})}
  if(out.length)await LN.schedule({notifications:out.slice(0,60)})}catch(e){}}

if(cloud){sb=supabase.createClient(TRK_CONFIG.url,TRK_CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true}});
 col={doc:function(k){return{set:function(){var d=loadDirty();d[k]='p';saveDirty(d);return flush()},delete:function(){var d=loadDirty();d[k]='d';saveDirty(d);return flush()}}}};
 sb.auth.onAuthStateChange(function(ev,s){setTimeout(function(){
  if(!s||!s.user){if(ev==='SIGNED_OUT'||ev==='INITIAL_SESSION'){if(user)loggedOut();else{needAuth=true;render()}}return}
  if(!user||user.id!==s.user.id)startSync(s)},0)});
 window.addEventListener('online',function(){flush();if(user&&!synced&&!syncing)startSync({user:user})})}
applyTheme();nativeInit();render();
})();
</script>
